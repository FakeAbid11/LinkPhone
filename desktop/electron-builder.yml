appId: app.linkphone.desktop
productName: LinkPhone
copyright: Copyright © 2026 FakeAbid11

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - build/icon.png
  - package.json
  - '!**/*.map'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  executableName: LinkPhone

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LinkPhone
  artifactName: LinkPhone-Setup-${version}.${ext}

portable:
  artifactName: LinkPhone-Portable-${version}.${ext}
