name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION: 0.8.2
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/linkphone-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/linkphone-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and collect APK
        run: |
          mkdir -p ../artifacts
          SUFFIX=release
          if [ -z "$ANDROID_KEYSTORE_PATH" ]; then SUFFIX=debug-signed; fi
          cp app/build/outputs/apk/release/app-release.apk "../artifacts/LinkPhone-${VERSION}-${SUFFIX}.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK" -path '*/build-tools/*/apksigner' -type f 2>/dev/null | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "../artifacts/LinkPhone-${VERSION}-${SUFFIX}.apk"
          ls -lh ../artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkPhone-Android
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop build, tests & e2e
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Electron smoke test
        run: npx playwright test

      - name: Package Windows app
        run: npm run dist:win

      - name: Packaged app smoke test
        env:
          LINKPHONE_EXE: release/win-unpacked/LinkPhone.exe
        run: npx playwright test e2e/packaged.spec.ts

      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinkPhone-Windows
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload desktop failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure-reports
          path: |
            desktop/test-results/**
            desktop/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
