name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Require signing secrets
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Refusing to publish an unsigned release."
          exit 1

      - name: Decode signing keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/linkphone-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/linkphone-release.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test, lint and build
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.value }}" \
            -PversionCode="${{ github.run_number }}" \
            --no-daemon --stacktrace

      - name: Verify and collect APK
        run: |
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            "../artifacts/LinkPhone-${{ steps.version.outputs.value }}.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK" -path '*/build-tools/*/apksigner' -type f 2>/dev/null | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "../artifacts/LinkPhone-${{ steps.version.outputs.value }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop release
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align package version with tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Typecheck, test and build
        run: |
          npm run typecheck
          npm test
          npm run build
          npx playwright test

      - name: Package Windows app
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: desktop/release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.apk *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "LinkPhone $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md \
            artifacts/*
